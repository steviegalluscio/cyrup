[package]
name = "cyrup-tool-search-core"
description = "pi codemode's engine-independent half, kept after the codemode tool was deleted: script source format, identifier sanitiser, BM25 tool ranker, JavaScript string/number/key semantics (gap-analysis 18)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# DELIBERATELY ABSENT: `deno_core` and every other JavaScript engine. Everything here is a total
# function over explicit inputs, which is what let the (now deleted) sandbox depend on this crate
# without this crate ever depending on an engine -- and what lets it survive that deletion. The
# workspace has no JavaScript engine at all now: both consumers, the codemode sandbox and
# `workflowScript`, are gone (docs/LEAN-FORK-PLAN.md steps 1 and 4).
[lints]
workspace = true

[dependencies]
# `ToolNamespace`: the group a tool belongs to. The ranker folds a namespace's name, description and
# instructions into a tool's search text (pi `createToolSearchDocument`), and `describe_namespace`
# returns one -- reusing the exposure model's type rather than minting a parallel one.
cyrup-core = { workspace = true }
serde = { workspace = true }
# Schemas are `serde_json::Value`. The workspace declares `preserve_order` (the declaration renderer
# must reproduce V8's key order for `const`/`enum` objects) and `float_roundtrip` (a number must
# parse to the double `JSON.parse` yields, or `Number.prototype.toString` prints other digits).
serde_json = { workspace = true }
thiserror = { workspace = true }

# [CYRUP-DELTA] `getrandom` (8 random bytes for the codemode output-spill file name), `base64`
# (decoding an `image()` block) and `tempfile` are gone: they were the `output` module's
# dependencies, and that module left with the codemode tool (docs/LEAN-FORK-PLAN.md step 1). They
# survived the step-3 rename because that commit is a move and nothing else.
